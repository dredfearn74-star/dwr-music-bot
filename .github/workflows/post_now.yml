name: Post now (manual)

# Runs the queue immediately instead of waiting for the 10:00 AM CT schedule.
# Use it when something was missed and needs to go out today.
# It posts exactly what the daily run would post: every QUEUED row dated today
# or earlier. Nothing dated in the future goes out early.
#
# Built 2026-08-17 to get Micah Spurlock's spotlight out after a transient
# Meta error dropped it — and because the Run workflow dialog on the daily
# schedule refused to open.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type yes to actually publish. Anything else does a safe preview only.'
        required: true
        default: 'no'
  # Fallback trigger. GitHub's "Run workflow" dialog sometimes refuses to load
  # ("Sorry, something went wrong"), which left us unable to run the bot by hand
  # on 2026-08-17 with a spotlight owed. Committing/touching the file RUN_NOW.txt
  # fires this workflow immediately, no dialog involved.
  push:
    paths:
      - 'RUN_NOW.txt'

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    # A run must never be able to eat a posting window again. The Aug 19
    # scheduled run sat there for 2h15m; GitHub's default lets a job run for
    # SIX HOURS before it is killed. Twenty minutes is far more than posting
    # ever needs (an Instagram reel polls for at most 5 minutes), so a stuck
    # run dies loudly while there is still time to fix it by hand.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Install ffmpeg (the 9:16 aspect gate uses ffprobe)
        # 2026-08-19: this step HUNG for 2h 15m on the scheduled run and silently
        # ate the Aug 19 James Wood spotlight. A run that FAILS goes red and tells
        # David. A run that HANGS tells nobody anything, which is worse. So:
        #   - hard 5-minute cap, then the step dies instead of hanging forever
        #   - one retry, because this is nearly always a flaky apt mirror
        #   - if it still will not install, the run CARRIES ON and posts anyway.
        # post.py's probe_video() already stands down gracefully when ffprobe is
        # missing (it warns and skips the 9:16 check), so the worst case is one
        # unchecked reel - never a missed post.
        timeout-minutes: 5
        continue-on-error: true
        run: |
          for attempt in 1 2; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; then
              echo "ffmpeg installed on attempt $attempt"
              exit 0
            fi
            echo "ffmpeg install attempt $attempt failed - retrying in 10s"
            sleep 10
          done
          echo "::warning::ffmpeg would not install. Posting anyway; the 9:16 reel aspect gate is skipped for this run."

      - name: Preview what would go out
        run: |
          python - <<'PY'
          import csv, datetime
          from zoneinfo import ZoneInfo
          today = datetime.datetime.now(ZoneInfo("America/Chicago")).date()
          print(f"Today in US Central: {today}")
          with open('content_queue.csv', encoding='utf-8') as fh:
              rows = list(csv.DictReader(fh))
          any_due = False
          for r in rows:
              st = (r.get('status') or '').upper()
              try:
                  due = datetime.datetime.strptime(r['date'].strip(), '%Y-%m-%d').date()
              except Exception:
                  continue
              att = int(r.get('attempts') or 0)
              go = (st in ('QUEUED', '') or (st == 'FAILED' and att < 3)) and due <= today
              if go:
                  any_due = True
                  print(f"  WILL POST  {r['date']}  {r.get('platform')}  {r.get('caption','')[:60]}")
          if not any_due:
              print("  (nothing is due — this run would post nothing)")
          PY


      - name: Record what is due before posting
        if: always()
        run: |
          python - <<'PY' > due_before.txt
          import csv, datetime
          from zoneinfo import ZoneInfo
          today = datetime.datetime.now(ZoneInfo("America/Chicago")).date()
          for r in csv.DictReader(open('content_queue.csv', encoding='utf-8')):
              st = (r.get('status') or '').strip().upper()
              try:
                  due = datetime.datetime.strptime(r['date'].strip(), '%Y-%m-%d').date()
              except Exception:
                  continue
              att = int((r.get('attempts') or '0').strip() or 0)
              if due <= today and (st == 'QUEUED' or st == '' or (st == 'FAILED' and att < 3)):
                  print(r['date'].strip())
          PY
          echo "Due at the start of this run:"; cat due_before.txt || true

      - name: Publish
        if: ${{ github.event.inputs.confirm == 'yes' || github.event_name == 'push' }}
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python post.py

      - name: Save queue status back to the repo
        if: always()
        run: |
          git config user.name "dwr-music-bot"
          git config user.email "actions@users.noreply.github.com"
          # Add only the files that exist. `git add` aborts the WHOLE command if any
          # pathspec is missing, and last_failure.txt only exists after a failure —
          # which silently stopped the queue ever being saved (2026-08-17).
          for f in content_queue.csv autopublish_log.txt last_failure.txt needs_tagging.txt needs_comment.txt; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -m "post: update queue status [skip ci]" || echo "nothing to commit"
          git push || echo "nothing to push"


      # ---- END STATE, NOT THE ATTEMPT --------------------------------------
      # 2026-08-19: the scheduled run hung for 2h15m and the Aug 19 James Wood
      # spotlight never went out. Nothing went red, so nobody was told — David
      # found out by looking at Facebook. A hung job is a failure.
      #
      # This step reads the queue back off disk AFTER posting and reports what
      # actually happened, not what we tried to do. It is deliberately NOT
      # "publishing nothing = red": on a day with nothing scheduled, publishing
      # nothing is correct, and a daily false alarm would train David to ignore
      # the real ones. The rule is: anything that was DUE must now be POSTED.
      - name: Verify the end state — did what was due actually publish?
        if: always()
        run: |
          python - <<'PY'
          import csv, os, sys
          due = []
          if os.path.exists('due_before.txt'):
              due = [l.strip() for l in open('due_before.txt', encoding='utf-8') if l.strip()]
          rows = {r['date'].strip(): r for r in csv.DictReader(open('content_queue.csv', encoding='utf-8'))}
          print("=" * 62)
          if not due:
              print("END STATE: nothing was due today. Nothing published. This is correct.")
              print("=" * 62)
              sys.exit(0)
          bad = []
          for d in due:
              r = rows.get(d)
              if r is None:
                  bad.append(f"{d} — ROW HAS VANISHED from the queue"); continue
              st = (r.get('status') or '').strip().upper()
              live = (r.get('posted_to') or '').strip() or 'nothing'
              if st == 'POSTED':
                  print(f"END STATE: {d} POSTED  (live on: {live})")
              else:
                  print(f"END STATE: {d} *** {st or 'NO STATUS'} ***  (live on: {live})")
                  bad.append(f"{d} was due but its status is {st or 'blank'} (live on: {live})")
          print("=" * 62)
          if bad:
              print("!! THIS RUN DID NOT FINISH THE JOB:")
              for b in bad:
                  print("   - " + b)
              print("   Marking the run FAILED so it goes red and David is told.")
              with open('last_failure.txt', 'w', encoding='utf-8') as fh:
                  fh.write("A scheduled post did not complete.\n\n" + "\n".join(bad) + "\n")
              sys.exit(1)
          print(f"All {len(due)} post(s) that were due are confirmed POSTED.")
          PY

      - name: Raise the alarm if a post failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let detail = '(no detail file was written)';
            try { detail = fs.readFileSync('last_failure.txt', 'utf8'); } catch (e) {}
            const when = new Date().toISOString().slice(0, 16).replace('T', ' ');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 DWR bot: a post failed to go out (${when} UTC)`,
              body: [
                '## A post did NOT go out', '',
                '```', detail.trim(), '```', '',
                'The bot retries automatically next run (up to 3 attempts). Anything already live is recorded in `posted_to` and will not be posted twice.', '',
                `[Open the full run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              ].join('\n'),
              labels: ['bot-failure']
            });
